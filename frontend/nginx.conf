server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API проксируется на бэкенд внутри docker-сети
    location /api/ {
        # Анкета из мини-аппа несёт два фото: дефолтного 1 МБ может не хватить.
        client_max_body_size 20m;
        # Имя контейнера, а не сервиса: в общей сети прокси есть чужие «backend».
        proxy_pass http://ik-tracker-backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service worker не должен кешироваться, иначе пуши не обновятся
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA: все остальные пути отдают index.html (vue-router history mode)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
